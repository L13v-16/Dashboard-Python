<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Dados Limpos — Pandas</title>
    <link rel="stylesheet" href="css/globais.css" />
    <style>
        .dados-container {
            max-width: 1300px;
            margin: 2rem auto;
            padding: 0 1rem;
        }

        .resumo-cards {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(180px, 1fr));
            gap: 1rem;
            margin-bottom: 2rem;
        }

        .card {
            background: #fff;
            border-radius: 8px;
            padding: 1.2rem;
            box-shadow: 0 2px 8px rgba(0,0,0,0.08);
        }

        .card h4 {
            color: #666;
            font-size: 0.85rem;
            margin-bottom: 0.4rem;
        }

        .card p {
            font-size: 1.4rem;
            font-weight: bold;
            color: #0084ff;
        }

        table {
            width: 100%;
            border-collapse: collapse;
            background: #fff;
            border-radius: 8px;
            overflow: hidden;
            box-shadow: 0 2px 8px rgba(0,0,0,0.08);
        }

        th, td {
            padding: 0.9rem 1rem;
            text-align: left;
            border-bottom: 1px solid #eee;
        }

        th {
            background: #2c2c2c;
            color: #fff;
            font-size: 0.9rem;
        }

        tr:hover {
            background: #f5f9ff;
        }

        .sem-preco {
            color: #c0392b;
            font-weight: bold;
        }

        .com-preco {
            color: #27ae60;
            font-weight: bold;
        }

        .badge {
            display: inline-block;
            padding: 0.2rem 0.6rem;
            border-radius: 12px;
            font-size: 0.8rem;
            background: #0084ff;
            color: #fff;
        }

        .nav-links {
            display: flex;
            gap: 1rem;
            align-items: center;
        }

        .nav-links a {
            color: #fff;
            text-decoration: none;
            font-size: 0.9rem;
        }

        .nav-links a:hover {
            color: #0084ff;
        }
    </style>
</head>
<body>
    <div class="navbar">
        <div class="header-inner-content">
            <h1 class="logo">WEB<span>SCRAPING</span></h1>
            <div class="nav-links">
                <a href="index.html">Dashboard</a>
                <a href="visualizar_dados.html">Dados Pandas</a>
            </div>
        </div>
    </div>

    <div class="dados-container">
        <h3 class="section-title">Dados limpos pelo Pandas</h3>
        <div class="subtitle-underline"></div>
        <p style="margin: 1rem 0; color: #555;">
            Resultado do tratamento de <code>dados/produtos_brutos.csv</code> → <code>dados/produtos_limpos.csv</code>
        </p>

        <div class="resumo-cards" id="resumo"></div>

        <table>
            <thead>
                <tr>
                    <th>Produto buscado</th>
                    <th>Nome na loja</th>
                    <th>Preço</th>
                    <th>Loja</th>
                    <th>Status</th>
                </tr>
            </thead>
            <tbody id="tabela"></tbody>
        </table>
    </div>

    <script>
        function parseCSV(texto) {
            const linhas = texto.trim().split("\n");
            const cabecalho = linhas[0].split(",");
            const registros = [];

            for (let i = 1; i < linhas.length; i++) {
                const valores = [];
                let atual = "";
                let dentroAspas = false;

                for (const char of linhas[i]) {
                    if (char === '"') {
                        dentroAspas = !dentroAspas;
                    } else if (char === "," && !dentroAspas) {
                        valores.push(atual);
                        atual = "";
                    } else {
                        atual += char;
                    }
                }
                valores.push(atual);

                const obj = {};
                cabecalho.forEach((col, idx) => {
                    obj[col.trim()] = valores[idx] ? valores[idx].trim() : "";
                });
                registros.push(obj);
            }

            return registros;
        }

        fetch("dados/produtos_limpos.csv")
            .then(res => res.text())
            .then(texto => {
                const dados = parseCSV(texto);
                const comPreco = dados.filter(d => d.preco_disponivel === "True");
                const semPreco = dados.filter(d => d.preco_disponivel !== "True");
                const precos = comPreco.map(d => parseFloat(d.preco_numerico));

                const min = Math.min(...precos);
                const max = Math.max(...precos);
                const media = precos.reduce((a, b) => a + b, 0) / precos.length;

                document.getElementById("resumo").innerHTML = `
                    <div class="card"><h4>Total</h4><p>${dados.length}</p></div>
                    <div class="card"><h4>Com preço</h4><p>${comPreco.length}</p></div>
                    <div class="card"><h4>Sem preço</h4><p>${semPreco.length}</p></div>
                    <div class="card"><h4>Preço mínimo</h4><p>R$ ${min.toFixed(2).replace(".", ",")}</p></div>
                    <div class="card"><h4>Preço máximo</h4><p>R$ ${max.toFixed(2).replace(".", ",")}</p></div>
                    <div class="card"><h4>Preço médio</h4><p>R$ ${media.toFixed(2).replace(".", ",")}</p></div>
                `;

                document.getElementById("tabela").innerHTML = dados.map(d => `
                    <tr>
                        <td>${d.produto_buscado}</td>
                        <td>${d.nome}</td>
                        <td class="${d.preco_disponivel === "True" ? "com-preco" : "sem-preco"}">
                            ${d.preco_formatado}
                        </td>
                        <td><span class="badge">${d.loja}</span></td>
                        <td>${d.preco_disponivel === "True" ? "✓ Disponível" : "✗ Indisponível"}</td>
                    </tr>
                `).join("");
            })
            .catch(() => {
                document.getElementById("tabela").innerHTML =
                    "<tr><td colspan='5'>Erro ao carregar dados. Rode: python tratamentodedados/main_pandas.py</td></tr>";
            });
    </script>
</body>
</html>
